[workspace]
resolver="2"
members= ["smppgc", "lmetrics", "string_tree", "profanity"]

[workspace.package]
authors=["ldev <ldev@ldev.eu.org>"]
edition = "2021"

[workspace.metadata.cross.target.armv7-unknown-linux-musleabihf]
pre-build = [
  "apk add openssl"
]

[patch.crates-io]
rocket = { git="https://github.com/Xgames123/Rocket.git", branch="v0.5" }
rocket_ws = { git="https://github.com/Xgames123/Rocket.git", branch="v0.5" }
rocket_dyn_templates = { git="https://github.com/Xgames123/Rocket.git", branch="v0.5" }
rocket_db_pools = { git="https://github.com/Xgames123/Rocket.git", branch="v0.5" }
