services:
  smppgc:
    build:
      target: dev
    ports:
      - 80:8080
    develop:
      watch:
        - action: sync
          path: smppgc/client
          target: /build/smppgc/client

        - action: sync+restart
          path: smppgc/templates
          target: /app/templates

        - action: rebuild
          path: smppgc/src

