services:
  smppgc:
    build:
      dockerfile: Dockerfile
      target: dev
    networks:
      - main
    ports:
      - 80:8080
    volumes:
      - proffilter:/var/proffilter
      - auth:/var/auth
    develop:
      watch:
        - action: sync
          path: smppgc/client
          target: /client

        - action: sync+restart
          path: smppgc/www
          target: /app/www

        - action: sync+restart
          path: smppgc/templates
          target: /app/templates

        - action: rebuild
          path: smppgc/src

volumes:
  proffilter:
  auth:

networks:
  main:
