services:

  smppgc:
    image: "smppserver_smppgc:${DEPLOY_VERSION}"
    restart: always
    networks:
      - db
      - proxy
      - metrics
    volumes:
      - gcproffilter:/var/proffilter
    secrets:
      - oauth_google
    deploy:
      placement:
        constraints:
          - node.labels.db == true # This constraint can be lifted once we load proffilter data from db



volumes:
  gcproffilter:

secrets:
  oauth_google:
    external: true

networks:
  db:
    external: true
  proxy:
    external: true
  metrics:
    external: true
